version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: ibs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ibs_workforce
      POSTGRES_USER: ibs_user
      POSTGRES_PASSWORD: ibs_password_2026_secure
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibs_user -d ibs_workforce"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ibs_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: ibs_api
    restart: unless-stopped
    environment:
      APP_NAME: "IBS AI Workforce"
      APP_ENV: "production"
      DATABASE_URL: "postgresql+asyncpg://ibs_user:ibs_password_2026_secure@db:5432/ibs_workforce"
      REDIS_URL: "redis://redis:6379/0"
      APP_URL: "http://localhost:3000"
      API_URL: "http://localhost:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - workspaces_data:/app/workspaces

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: ibs_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  workspaces_data:
